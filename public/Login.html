<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Fashionly</title>
  <link href="/output/output.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

  <div class="bg-white w-full max-w-sm shadow-lg rounded overflow-hidden">
    <!-- Form -->
    <div class="p-6">
      <img src="../Aset/main 2.jpg" alt="Fashion Image" class="w-full h-48 object-cover rounded-md mb-4">
      <h2 class="text-center text-2xl font-serif font-semibold mb-1">FLY</h2>
      <p class="text-center text-xs text-gray-600 mb-6">Login to FASHIONLY</p>

      <form class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
          <input type="email" class="w-full px-3 py-2 border rounded focus:outline-none focus:ring focus:ring-blue-200" placeholder="Enter your email">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
          <input type="password" class="w-full px-3 py-2 border rounded focus:outline-none focus:ring focus:ring-blue-200" placeholder="Enter your password">
        </div>
        <div class="text-right text-xs text-gray-500 hover:text-blue-500 cursor-pointer">
          Forget Password?
        </div>
        <button type="submit" class="w-full bg-blue-300 hover:bg-blue-400 text-white py-2 rounded">
          Login
        </button>
      </form>

      <p class="text-center text-xs text-gray-600 mt-4">
        Don’t Have An Account? 
        <a href="register.html" class="text-blue-500 hover:underline">Sign in</a>
      </p>
    </div>
  </div>
<script src="/script/login.js"></script>
</body>

</html>
