<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Register</title>
    <link rel="stylesheet" href="/output/output.css">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div class="bg-white w-full max-w-sm shadow-lg rounded overflow-hidden">
        <!-- Form -->
        <div class="p-6">
            <h2 class="text-center text-2xl font-serif font-semibold mb-1">FLY</h2>
            <p class="text-center text-xs text-gray-600 mb-6">Sign in to FASHIONLY</p>

            <form class="space-y-4">
                <!-- Username -->
                <div>
                    <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                    <input type="text" id="username" name="username" class="w-full px-3 py-2 border rounded focus:outline-none focus:ring focus:ring-blue-200" placeholder="Enter your username" required>
                </div>

                <!-- Email -->
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                    <input type="email" id="email" name="email" class="w-full px-3 py-2 border rounded focus:outline-none focus:ring focus:ring-blue-200" placeholder="Enter your email" required>
                </div>

                <!-- Password -->
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <input type="password" id="password" name="password" class="w-full px-3 py-2 border rounded focus:outline-none focus:ring focus:ring-blue-200" placeholder="Enter your password" required>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="w-full bg-blue-300 hover:bg-blue-400 text-white py-2 rounded">
                    Sign in
                </button>
            </form>

            <!-- Footer Text -->
            <p class="text-center text-xs text-gray-600 mt-4">
                Already have an account? 
                <a href="Login.html" class="text-blue-500 hover:underline">Login</a>
            </p>
        </div>
    </div>
<script src="/script/register.js"></script>
</body>
</html>
