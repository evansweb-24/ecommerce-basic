<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cart</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
</head>
<body class="bg-gray-100">
    
    <nav class="bg-white dark:bg-gray-900 fixed w-full z-20 top-0 start-0 border-b border-gray-200 dark:border-gray-600">
        <div class="max-w-screen-xl flex flex-wrap items-center justify-between mx-auto p-4">
            <span class="self-center text-2xl whitespace-nowrap dark:text-white font-serif Jacques Francois Shadow font-normal">FASHIONLY</span>
        </a>
        <div class="flex md:order-2 space-x-3 md:space-x-0 rtl:space-x-reverse">
          <img src="../Aset/Vector@2x.png" alt="cart" class="h-6 w-auto object-contain mr-7 mt-2">
          <a href="/public/profile.html">
            <img src="../Aset/Group 5.png" alt="profile" class="h-10 w-auto object-contain">
          </a>
    
            <button data-collapse-toggle="navbar-sticky" type="button" class="inline-flex items-center p-2 w-10 h-10 justify-center text-sm text-gray-500 rounded-lg md:hidden hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-gray-200 dark:text-gray-400 dark:hover:bg-gray-700 dark:focus:ring-gray-600" aria-controls="navbar-sticky" aria-expanded="false">
              <span class="sr-only">Open main menu</span>
              <svg class="w-5 h-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 17 14">
                  <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M1 1h15M1 7h15M1 13h15"/>
              </svg>
          </button>
        </div>
        <div class="items-center justify-between hidden w-full md:flex md:w-auto md:order-1" id="navbar-sticky">
            
            <!--Search Bar-->
            <form class="flex items-center space-x-2 max-w-md mx-auto">
                <label for="default-search" class="sr-only">Search</label>
                <div class="relative w-full max-w-xs">
                    <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                        <svg class="w-4 h-4 text-gray-500 dark:text-gray-400" fill="none" viewBox="0 0 20 20">
                            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m19 19-4-4m0-7A7 7 0 1 1 1 8a7 7 0 0 1 14 0Z"/>
                        </svg>
                    </div>
                    <input type="search" id="default-search" class="block w-full pl-10 pr-4 py-2 text-sm border mr-11 border-gray-300 rounded-lg bg-gray-50 focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white" placeholder="Search..." required />
                </div>
                <button type="submit" class="text-white bg-blue-700 hover:bg-blue-200 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-4 py-2 dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800">Search</button>
            </form>
            
            <!--Navbar-->
          <ul class=" space-x-7 flex flex-col p-4 md:p-0 mt-4 font-medium border border-gray-100 rounded-lg bg-gray-50 md:space-x-8 rtl:space-x-reverse md:flex-row md:mt-0 md:border-0 md:bg-white dark:bg-gray-800 md:dark:bg-gray-900 dark:border-gray-700">
            <li>
              <a href="/public/Home.html" class="block py-2 px-3 text-gray-900  rounded-sm md:bg-transparent ml-9 md:p-0 md:hover:text-blue-700" aria-current="page">HOME</a>
            </li>
            <li>
              <a href="#" class="block py-2 px-3 text-gray-900 rounded-sm hover:bg-gray-100 md:hover:bg-transparent md:hover:text-blue-700 md:p-0 md:dark:hover:text-blue-500 dark:text-white dark:hover:bg-gray-700 dark:hover:text-white md:dark:hover:bg-transparent dark:border-gray-700">SHOP</a>
            </li>
            <li>
              <a href="#" class="block py-2 px-3 text-gray-900 rounded-sm hover:bg-gray-100 md:hover:bg-transparent md:hover:text-blue-700 md:p-0 md:dark:hover:text-blue-500 dark:text-white dark:hover:bg-gray-700 dark:hover:text-white md:dark:hover:bg-transparent dark:border-gray-700">BLOG</a>
            </li>
            <li>
              <a href="#" class="block py-2 px-3 text-gray-900 rounded-sm hover:bg-gray-100 md:hover:bg-transparent md:hover:text-blue-700 md:p-0 md:dark:hover:text-blue-500 dark:text-white dark:hover:bg-gray-700 dark:hover:text-white md:dark:hover:bg-transparent dark:border-gray-700">BRANDS</a>
            </li>
            <li>
              <a href="#" class="block py-2 px-3 text-gray-900 rounded-sm hover:bg-gray-100 md:hover:bg-transparent md:hover:text-blue-700 md:p-0 md:dark:hover:text-blue-500 dark:text-white dark:hover:bg-gray-700 dark:hover:text-white md:dark:hover:bg-transparent dark:border-gray-700">CONTACT</a>
            </li>
          </ul>
        </div>
        </div>
      </nav>

    <div class="max-w-6xl mx-auto px-4 py-8 mt-16">
        <h2 class="text-2xl font-bold mb-6 text-center">Keranjang Belanja</h2>
      
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
          <!-- Cart Items -->
          <div class="md:col-span-2 space-y-4">
            <!-- Single Item -->
            <div class="flex items-center gap-4 border p-4 rounded-lg shadow-sm">
              
              <div class="flex-1">
                <h3 class="font-semibold text-lg">Nama Produk</h3>
                <p class="text-sm text-gray-500">Rp 0</p>
                <div class="mt-2 flex items-center gap-2">
                  <input type="number" value="1" min="1" class="w-16 px-2 py-1 border rounded" />
                  <button class="text-red-500 hover:underline text-sm">Hapus</button>
                </div>
              </div>
              <div class="text-right font-semibold">Rp 0</div>
            </div>
      
            <!-- Tambah item lain dengan menyalin div di atas -->
          </div>
      
          <!-- Summary -->
          <div class="border p-6 rounded-lg shadow-md bg-gray-50">
            <h3 class="text-xl font-bold mb-4">Ringkasan</h3>
            <div class="flex justify-between mb-2">
              <span>Subtotal</span>
              <span id="total-price">Rp 0</span>
            </div>
            <div class="flex justify-between mb-2">
              <span>Pajak</span>
              <span>Rp 0</span>
            </div>
            <hr class="my-2" />
            <div class="flex justify-between font-semibold text-lg">
              <span>Total</span>
              <span id="total-all">Rp 0</span>
            </div>
            <button id="checkout-btn" class="block w-full text-center mt-4 bg-black text-white py-3 rounded-xl font-semibold shadow-md hover:bg-gray-800 transition duration-300">
              Checkout
            </button>          
            <button id="clear-cart" class="w-full mt-2 bg-red-600 text-white py-2 rounded-lg hover:bg-red-700 transition">Kosongkan Keranjang</button>

          </div>
        </div>
      </div>
      

  <script src="/script/Cart.js"></script>
  <script src="/script/pembayaran.js"></script>
</body>
</html>
